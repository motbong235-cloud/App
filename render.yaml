# APSARA SMM BOT — Render
# Dashboard: New → Web Service → connect GitHub repo
# Build: pip install -r requirements.txt
# Start: python kaijaklike_bot.py

services:
  - type: web
    name: apsara-smm-bot
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python kaijaklike_bot.py
    healthCheckPath: /health
    disk:
      name: apsara-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: BOT_DISPLAY_NAME
        value: APSARA SMM BOT
      - key: CONTROL_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: PAY_METHOD
        value: khpay
      - key: KHPAY_API_KEY
        sync: false
      - key: KHPAY_MERCHANT_ID
        sync: false
      - key: BAKONG_API_TOKEN
        sync: false
      - key: DEP_QR_COOLDOWN_SEC
        value: "15"
